[build]
  publish = "."
  functions = "netlify/functions"
  command = "node inject-title.js && npm install && cd netlify/functions && npm install"

[functions]
  node_bundler = "esbuild"

# Rewrite /api/* to the matching Netlify function
[[redirects]]
  from   = "/api/bin-list"
  to     = "/.netlify/functions/bin-list"
  status = 200

[[redirects]]
  from   = "/api/bin-read"
  to     = "/.netlify/functions/bin-read"
  status = 200

[[redirects]]
  from   = "/api/bin-write"
  to     = "/.netlify/functions/bin-write"
  status = 200

[[redirects]]
  from   = "/api/verify-admin"
  to     = "/.netlify/functions/verify-admin"
  status = 200
